          </div>
        </div>
        <div className="hint" ref={hint}><Tagline style={{fontSize:'clamp(14px,1.3vw,22px)',color:'var(--white)'}} /></div>
      </div>
      <div className="vh-probe" ref={probe}></div>
      {zoom && <div key={zoom.key} className={'bag-zoom' + (zoom.open ? ' open' : '') + (zoom.fade ? ' fade' : '')}
        style={{ left: zoom.t.left + 'px', top: zoom.t.top + 'px', width: zoom.t.width + 'px', height: zoom.t.height + 'px' }}>
        {zoom.key === 'side' ? <img style={{objectPosition:'center top'}} src={(window.__resources&&window.__resources.r4)||"assets/web/interiorem-window.jpg"} alt="Interiorem homepage featuring a mid-century teak sideboard" /> : <img src={(window.__resources&&window.__resources.r5)||"assets/web/chair-label-campaign.jpg"} alt="Chair label Collection 01 campaign: two models in black and white chair label shirts" />}
      </div>}
      <div className={'menu' + (menu ? ' open' : '')} aria-hidden={!menu}>
        <div className="menu-top"><Logo height={26} color="var(--white)" /><IconButton icon="x" label="Close menu" onClick={() => setMenu(false)} style={{color:'var(--white)'}} /></div>
        <nav className="menu-links">{['Studio','Services','Work'].map((l, i) => <a key={l} href="#" onClick={() => setMenu(false)} style={{transitionDelay: menu ? (80 + i * 60) + 'ms' : '0ms'}}>{l}</a>)}</nav>
        <div className="menu-foot"><Tagline style={{color:'var(--white)',fontSize:'14px'}} /></div>
      </div>
    </section>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ZoomHero />);
</script>
</body></html>
