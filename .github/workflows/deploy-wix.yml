# Deploy the site to Wix (Wix-managed headless) on every push to main.
#
# One-time setup:
#   1. In Wix, create an API key (Account settings → API Keys) for your account.
#   2. In GitHub: repo Settings → Secrets and variables → Actions → New repository secret
#      Name: WIX_API_KEY   Value: the key from step 1.
#   3. Push to main, or run this workflow from the Actions tab.
#
# The first run creates the Wix project (`init`), points it at ./site and commits
# wix.config.json back to the repo. Every later run just releases ./site.
name: Deploy to Wix

on:
  push:
    branches: [main]
    paths: ['site/**', 'wix.config.json', '.github/workflows/deploy-wix.yml']
  workflow_dispatch:

concurrency:
  group: wix-deploy
  cancel-in-progress: false

permissions:
  contents: write   # only used on the first run, to commit wix.config.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the Wix API key is set
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Add a WIX_API_KEY repository secret (see the top of this file)."
            exit 1
          fi

      - name: Sign in to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: npx -y @wix/cli@latest login --api-key "$WIX_API_KEY"

      # First run only: create the Wix project and link this repo to it.
      - name: Create the Wix project (first run)
        if: hashFiles('wix.config.json') == ''
        run: |
          npm create @wix/new@latest init
          # The site is plain HTML with no build step: deploy the site/ folder as-is.
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wix.config.json", "utf8"));
            c.site = { ...(c.site || {}), outputDirectory: "./site" };
            fs.writeFileSync("wix.config.json", JSON.stringify(c, null, 2) + "\n");
          '
          cat wix.config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wix.config.json
          git commit -m "Link repo to Wix headless project [skip ci]"
          git push

      - name: Release to Wix
        run: npx -y @wix/cli@latest release
