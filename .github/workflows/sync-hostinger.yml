# Publish the site to Hostinger — manually only (Actions tab → "Sync Hostinger branch" → Run workflow).
#
# Hostinger (slategray-hare-109007.hostingersite.com) deploys the `hostinger` branch into
# public_html whenever that branch changes. The branch holds only the contents of site/; this job
# rebuilds it from main's site/ folder and pushes it. Pushes to main do NOT trigger it.
name: Sync Hostinger branch

on:
  workflow_dispatch:

concurrency:
  group: hostinger-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push site/ to the hostinger branch
        run: |
          git subtree split --prefix site -b hostinger-build
          git push --force origin hostinger-build:hostinger
